          <b>任务：</b>作为主 PM 从 0 到 1 负责马来西亚（MY）TTPay Balance 钱包金融还款新场景，拓展余额支用范围，提升钱包 TPV 渗透与资金留存。<br>
          <b>行动：</b>独立撰写 PRD，与设计师共同完成收银台及钱包支付交互；牵头 Trade、收银台、金融、Treasury、Finance、账单等产品及研发团队，设计多主体资金流方案；作为 Payment Compliance 主要对接人完成业务方案说明、风险问题响应及替代方案设计，推动项目通过评审并上线。<br>
          <b>结果：</b>7月14日开始灰度、7月31日全量上线；截至 8 月累计覆盖 <b>50K+ 用户</b>、约 <b>500K 金融还款</b>。A/B 实验带动 MY TTPay 钱包交易量 <b>+5%</b>、余额支付渗透率 <b>+22.3%</b>、支付成功率 <b>+1.17%</b>；用户充值入金率 <b>+12.11%</b>、人均充值金额 <b>+23.63%</b>，提现率 <b>-18.8%</b>、人均提现金额 <b>-20.0%</b>；BNPL/Ploan 及电商核心护栏指标无显著负向影响。


  - type: projects
