    content:

      - title: "NVIDIA Nemotron Model Reasoning Challenge"
        duration: "2026年06月 - 2026年08月"
        sub: "大语言模型推理微调 | Kaggle 银牌 · 71 / 4182（Top 1.7%）"
        detail: >
          <b>任务：</b>基于 NVIDIA Nemotron 30B-A3B 提升模型在抽象推理任务上的准确率。<br>
          <b>行动：</b>编写代码自动构建 Synthetic Reasoning Traces，设计 YAML 推理数据格式与训练流程，并基于生成数据提交 LoRA 微调模型。<br>
          <b>结果：</b>将 benchmark 准确率由 Base Model 的 <b>0.60 提升至 0.86</b>，最终排名 <b>71 / 4182</b>，获得 Kaggle 银牌。


      - title: "Kaggle NFL Big Data Bowl 2026"
        duration: "2025年09月 - 2025年12月"
        sub: "物理感知时空序列建模 | Kaggle 银牌 · 33 / 1899（Top 1.7%）"
        detail: >
          <b>任务：</b>预测传球过程中 NFL 球员未来运动轨迹，解决多人交互、运动惯性及长时序轨迹预测问题。<br>
          <b>行动：</b>提出 Chiral Augmentation（Random Y-Flip）引入球场镜像对称先验；优化 STTRE 时空 Transformer，引入 Relative Role Bias、Gated Fusion 与辅助速度损失；设计 Polar Vector Ensemble，在极坐标空间融合速度幅值与运动方向，并集成 STTRE、GNN 与 Bi-GRU。<br>
          <b>结果：</b>实现 Public LB <b>0.519</b>，最终全球排名 <b>33 / 1899</b>，获得 Kaggle 银牌。


      - title: "Vesuvius Challenge - Surface Detection"
        duration: "2025年12月 - 2026年02月"
        sub: "3D 计算机视觉 | Kaggle 银牌 · 69 / 1391（Top 5%）"
        detail: >
          <b>任务：</b>从大规模低对比度 3D X 射线体素中识别碳化古卷轴表面，为虚拟展开与隐藏文字复原提供分割结果。<br>
          <b>行动：</b>基于 PyTorch 构建 3D 语义分割训练流程，针对低对比度体素优化特征提取与数据 Pipeline，并使用 DDP 完成多 GPU 分布式训练与快速实验迭代。<br>
          <b>结果：</b>最终全球排名 <b>69 / 1391</b>，获得 Kaggle 银牌。


